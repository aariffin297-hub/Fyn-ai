<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fyn AI – Your Smart Study Assistant</title>
  <meta name="description" content="Fyn AI - Chat and get help with school, homework, and learning.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f19;
      --bg-sidebar: #0f1420;
      --bg-user: #7c5cff;
      --bg-ai: #1a2234;
      --text: #e8eaf0;
      --text-muted: #8b95a8;
      --border: rgba(255,255,255,0.07);
      --primary: #7c5cff;
      --accent: #00d4ff;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    .sidebar {
      width: 260px;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 20px 16px;
      flex-shrink: 0;
    }

    .logo {
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 8px;
      padding: 0 8px;
    }
    .logo span {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .logo-sub {
      font-size: 0.78rem;
      color: var(--text-muted);
      padding: 0 8px 24px;
    }

    .new-chat-btn {
      background: rgba(124, 92, 255, 0.15);
      border: 1px solid rgba(124, 92, 255, 0.3);
      color: #c4b5ff;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 24px;
    }
    .new-chat-btn:hover { background: rgba(124, 92, 255, 0.25); }

    .sidebar-footer {
      margin-top: auto;
      padding: 12px 8px;
      font-size: 0.78rem;
      color: var(--text-muted);
      line-height: 1.45;
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    .chat-header {
      padding: 14px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(11, 15, 25, 0.85);
      backdrop-filter: blur(12px);
    }
    .chat-header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .chat-header h1 {
      font-size: 1.15rem;
      font-weight: 600;
    }
    .chat-header .subtitle {
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    .status {
      font-size: 0.78rem;
      color: #4ade80;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status::before {
      content: '';
      width: 7px;
      height: 7px;
      background: #4ade80;
      border-radius: 50%;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      scroll-behavior: smooth;
    }

    .message {
      display: flex;
      gap: 14px;
      max-width: 780px;
      width: 100%;
      margin: 0 auto;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.95rem;
      flex-shrink: 0;
      font-weight: 600;
    }
    .avatar.user { background: var(--primary); }
    .avatar.ai { background: linear-gradient(135deg, #7c5cff, #00d4ff); }

    .bubble {
      padding: 14px 18px;
      border-radius: 16px;
      line-height: 1.6;
      font-size: 0.97rem;
      max-width: 100%;
      white-space: pre-wrap;
    }
    .message.user .bubble {
      background: var(--bg-user);
      border-bottom-right-radius: 4px;
    }
    .message.ai .bubble {
      background: var(--bg-ai);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }
    .message.user { flex-direction: row-reverse; }

    .typing {
      display: flex;
      gap: 5px;
      padding: 8px 4px;
    }
    .typing span {
      width: 7px;
      height: 7px;
      background: var(--text-muted);
      border-radius: 50%;
      animation: bounce 1.4s infinite ease-in-out;
    }
    .typing span:nth-child(1) { animation-delay: 0s; }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40% { transform: scale(1); opacity: 1; }
    }

    .input-area {
      padding: 16px 24px 24px;
      background: linear-gradient(to top, var(--bg) 80%, transparent);
    }
    .input-wrapper {
      max-width: 780px;
      margin: 0 auto;
      background: #151c2c;
      border: 1px solid var(--border);
      border-radius: 18px;
      display: flex;
      align-items: flex-end;
      padding: 10px 12px 10px 18px;
      transition: border-color 0.2s;
    }
    .input-wrapper:focus-within {
      border-color: rgba(124, 92, 255, 0.5);
    }
    textarea {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text);
      font-family: inherit;
      font-size: 0.98rem;
      resize: none;
      max-height: 140px;
      padding: 8px 0;
      outline: none;
      line-height: 1.5;
    }
    textarea::placeholder { color: var(--text-muted); }

    .send-btn {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: var(--primary);
      border: none;
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      flex-shrink: 0;
      margin-left: 8px;
    }
    .send-btn:hover { background: #6a4af0; transform: scale(1.05); }
    .send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    .hint {
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 10px;
    }

    .welcome {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 24px;
      max-width: 680px;
      margin: 0 auto;
    }
    .welcome h2 {
      font-size: 1.9rem;
      margin-bottom: 10px;
      background: linear-gradient(135deg, #fff, #a5b4fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .welcome p {
      color: var(--text-muted);
      margin-bottom: 28px;
      font-size: 1.05rem;
    }
    .suggestions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      width: 100%;
    }
    .suggestion {
      background: var(--bg-ai);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 0.9rem;
      color: var(--text);
    }
    .suggestion:hover {
      border-color: rgba(124, 92, 255, 0.45);
      background: #1e2740;
    }

    @media (max-width: 768px) {
      .sidebar { display: none; }
      .suggestions { grid-template-columns: 1fr; }
      .messages { padding: 16px; }
      .input-area { padding: 12px 16px 20px; }
      .chat-header .subtitle { display: none; }
    }
  </style>
</head>
<body>
  <div class="sidebar">
    <div class="logo"><span>Fyn AI</span></div>
    <div class="logo-sub">Smart Study Assistant</div>
    <button class="new-chat-btn" onclick="newChat()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
      New chat
    </button>
    <div class="sidebar-footer">
      Demo version<br>
      Replies are simulated.<br>
      Great for school practice!
    </div>
  </div>

  <div class="main">
    <div class="chat-header">
      <div class="chat-header-left">
        <div>
          <h1>Fyn AI</h1>
          <div class="subtitle">Your smart study & homework helper</div>
        </div>
      </div>
      <div class="status">Online</div>
    </div>

    <div class="messages" id="messages"></div>

    <div class="input-area">
      <div class="input-wrapper">
        <textarea id="userInput" placeholder="Ask about school, homework, math, science..." rows="1" onkeydown="handleKey(event)"></textarea>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>
      <div class="hint">Fyn AI Demo • For school help & practice • Not a real AI model</div>
    </div>
  </div>

  <script>
    const messagesEl = document.getElementById('messages');
    const inputEl = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');

    const responses = {
      greeting: [
        "Hey! 👋 I'm Fyn AI, your study assistant. How can I help with school today?",
        "Hello! Ready to help with homework, explanations, or study tips. What do you need?",
        "Hi there! Ask me anything about school subjects and I'll do my best to help."
      ],
      howAreYou: [
        "I'm doing great and ready to help you learn! How are your studies going?",
        "All systems good! What subject are we working on today?"
      ],
      whoAreYou: [
        "I'm Fyn AI — a demo study assistant designed to help students with school topics, homework ideas, and explanations. Think of me as practice for chatting with a real AI tutor!",
        "I'm Fyn AI, your friendly study helper. This version uses sample replies so you can practice asking questions about school."
      ],
      whatCanYouDo: [
        "I can help with:\n• Explaining school topics (math, science, history, etc.)\n• Study tips and planning\n• Homework ideas and structure\n• Simple practice questions\n• Motivation and learning advice\n\nJust ask me something related to school!",
        "I'm focused on school help. Try asking me to explain a topic, give study tips, help with math concepts, or create a simple study plan."
      ],
      thanks: [
        "You're welcome! Keep asking if you need more help. 📚",
        "Happy to help! Good luck with your studies."
      ],
      joke: [
        "Why did the student eat his homework? Because the teacher said it was a piece of cake! 😄",
        "Why was the math book sad? It had too many problems.",
        "What do you call a student who is good at history? A past master!"
      ],

      // School / Study
      studyTips: [
        "Here are some effective study tips:\n\n1. Use the Pomodoro method (25 min study + 5 min break)\n2. Teach the topic to someone else (or pretend to)\n3. Make short summary notes in your own words\n4. Practice active recall instead of only re-reading\n5. Sleep well — your brain consolidates memory while sleeping\n\nWhich subject are you studying right now?",
        "Quick study advice:\n• Break big topics into small parts\n• Test yourself instead of just reading\n• Study in short focused sessions\n• Review material the next day\n\nWant tips for a specific subject?"
      ],
      homework: [
        "I can help you structure your homework! Tell me:\n1. What subject is it?\n2. What is the question or topic?\n\nThen I'll give you ideas, steps, or an explanation to get you started.",
        "Homework helper mode activated ✅\nDescribe the assignment and I'll help you break it down or explain the concept."
      ],
      math: [
        "Math time! 🔢\nI can help explain concepts like fractions, equations, percentages, geometry, algebra basics, and more.\n\nTell me the specific topic or problem (you can type it) and I'll walk you through it step by step.",
        "Sure, let's do math. What do you need help with? (examples: solving equations, fractions, percentages, area/perimeter, simple algebra...)"
      ],
      science: [
        "Science is fun! I can help with topics like:\n• Photosynthesis\n• The water cycle\n• Solar system & planets\n• States of matter\n• Simple physics concepts\n• Human body basics\n\nWhich science topic do you want explained?",
        "Science mode on 🔬\nAsk me to explain any school science topic and I'll give a clear, student-friendly answer."
      ],
      history: [
        "History helper ready! I can explain important events, timelines, causes and effects in simple language.\n\nWhat period or event are you studying? (example: World War 2, ancient civilizations, independence movements, etc.)",
        "Tell me the history topic and I'll give you a clear summary with key points that are easy to remember."
      ],
      english: [
        "English help is here! I can assist with:\n• Essay structure\n• Grammar tips\n• Vocabulary\n• How to write introductions and conclusions\n• Understanding stories or poems\n\nWhat do you need help with?",
        "For English: tell me if you need help writing, grammar, or understanding a text, and I'll guide you."
      ],
      exam: [
        "Exam coming up? Here's a simple plan:\n\n1. List all topics that will be on the test\n2. Rank them: Easy / Medium / Hard\n3. Spend more time on Hard topics\n4. Do practice questions every day\n5. Review your mistakes\n6. Sleep well the night before\n\nWant a study schedule for a specific subject?",
        "I can help you prepare! Tell me the subject and how many days you have left until the exam."
      ],
      motivation: [
        "You've got this! 💪 Every expert was once a beginner. Studying a little every day is better than cramming. Take it one topic at a time — progress adds up fast.\n\nWhat are you working on right now?",
        "Remember: hard work beats talent when talent doesn't work hard. You're already taking a good step by asking for help. Keep going!"
      ],
      photosynthesis: [
        "Photosynthesis is how plants make their own food using sunlight.\n\nSimple version:\n• Plants take in carbon dioxide (CO₂) from the air\n• They take in water (H₂O) from the soil\n• Using sunlight and chlorophyll, they convert these into glucose (sugar) and oxygen\n\nEquation:\n6CO₂ + 6H₂O + light → C₆H₁₂O₆ + 6O₂\n\nThe oxygen is released into the air — that's why plants are so important!"
      ],
      waterCycle: [
        "The Water Cycle (simplified):\n\n1. Evaporation – Sun heats water in rivers/oceans → turns into water vapor\n2. Condensation – Water vapor cools and forms clouds\n3. Precipitation – Water falls as rain, snow, etc.\n4. Collection – Water goes back into rivers, lakes, oceans\n\nThen the cycle repeats. This is how Earth recycles water!"
      ],
      fractions: [
        "Fractions represent parts of a whole.\n\nExample: 3/4 means 3 parts out of 4 equal parts.\n\nKey tips:\n• Numerator = top number (how many parts you have)\n• Denominator = bottom number (total equal parts)\n• To add fractions with the same denominator: just add the top numbers\n• To add different denominators: find a common denominator first\n\nWant me to explain a specific fraction problem?"
      ],
      defaultSchool: [
        "That sounds like a school-related question! In this demo I have prepared answers for many common topics (math, science, study tips, homework help, etc.).\n\nTry asking more specifically, for example:\n• \"Explain photosynthesis\"\n• \"Give me study tips\"\n• \"Help with fractions\"\n• \"How to prepare for exams\"",
        "I'd love to help with that school topic. Because this is a demo, try asking about popular subjects like math, science, history, English, study tips, or homework structure — I have good sample answers for those!"
      ],
      default: [
        "Interesting! This demo version works best with school and study questions. Try asking me about a subject, homework help, or study tips and I'll give you a useful reply.",
        "I'm mainly trained (in this demo) for school help. Ask me something about studying, math, science, or homework and I'll respond with a helpful sample answer!"
      ]
    };

    function getResponse(text) {
      const lower = text.toLowerCase().trim();

      // Greetings & basic
      if (/^(hi|hello|hey|hola|yo|sup|good morning|good afternoon)\b/.test(lower)) return random(responses.greeting);
      if (/how are you|how's it going|how do you do/.test(lower)) return random(responses.howAreYou);
      if (/who are you|what are you|your name/.test(lower)) return random(responses.whoAreYou);
      if (/what can you do|what do you do|help me with|capabilities|features/.test(lower)) return random(responses.whatCanYouDo);
      if (/thank|thanks|thx|appreciate/.test(lower)) return random(responses.thanks);
      if (/joke|funny|laugh|make me laugh/.test(lower)) return random(responses.joke);
      if (/bye|goodbye|see you|later/.test(lower)) return "Goodbye! Good luck with your studies. Come back anytime. 📚👋";

      // School specific
      if (/study tip|how to study|study advice|study better|study method/.test(lower)) return random(responses.studyTips);
      if (/homework|assignment|project help/.test(lower)) return random(responses.homework);
      if (/math|mathematics|algebra|equation|calculate|fraction|percentage|geometry/.test(lower)) {
        if (/fraction/.test(lower)) return responses.fractions[0];
        return random(responses.math);
      }
      if (/science|biology|physics|chemistry|photosynthesis|water cycle|planet|solar system/.test(lower)) {
        if (/photosynthesis/.test(lower)) return responses.photosynthesis[0];
        if (/water cycle/.test(lower)) return responses.waterCycle[0];
        return random(responses.science);
      }
      if (/history|world war|ancient|civilization|historical/.test(lower)) return random(responses.history);
      if (/english|essay|grammar|writing|vocabulary|literature/.test(lower)) return random(responses.english);
      if (/exam|test|quiz|prepare for test|revision/.test(lower)) return random(responses.exam);
      if (/motivation|motivated|lazy|give up|hard to study|procrastinat/.test(lower)) return random(responses.motivation);

      // General school fallback
      if (/school|student|class|subject|learn|lesson|teacher|grade|homework|study/.test(lower)) {
        return random(responses.defaultSchool);
      }

      return random(responses.default);
    }

    function random(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    function showWelcome() {
      messagesEl.innerHTML = `
        <div class="welcome">
          <h2>Fyn AI</h2>
          <p>Your smart study assistant<br>Ask me about school subjects, homework, or study tips</p>
          <div class="suggestions">
            <div class="suggestion" onclick="sendSuggestion('Give me study tips')">📚 Give me study tips</div>
            <div class="suggestion" onclick="sendSuggestion('Explain photosynthesis')">🌱 Explain photosynthesis</div>
            <div class="suggestion" onclick="sendSuggestion('Help with fractions')">🔢 Help with fractions</div>
            <div class="suggestion" onclick="sendSuggestion('How to prepare for exams')">📝 How to prepare for exams</div>
            <div class="suggestion" onclick="sendSuggestion('What can you do?')">✨ What can you do?</div>
            <div class="suggestion" onclick="sendSuggestion('Tell me a school joke')">😄 Tell me a school joke</div>
          </div>
        </div>
      `;
    }

    function addMessage(text, isUser = false) {
      const welcome = messagesEl.querySelector('.welcome');
      if (welcome) welcome.remove();

      const msg = document.createElement('div');
      msg.className = `message ${isUser ? 'user' : 'ai'}`;
      msg.innerHTML = `
        <div class="avatar ${isUser ? 'user' : 'ai'}">${isUser ? 'You' : 'F'}</div>
        <div class="bubble">${text}</div>
      `;
      messagesEl.appendChild(msg);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function showTyping() {
      const typing = document.createElement('div');
      typing.className = 'message ai';
      typing.id = 'typing';
      typing.innerHTML = `
        <div class="avatar ai">F</div>
        <div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>
      `;
      messagesEl.appendChild(typing);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function removeTyping() {
      const t = document.getElementById('typing');
      if (t) t.remove();
    }

    function sendMessage() {
      const text = inputEl.value.trim();
      if (!text) return;

      addMessage(text, true);
      inputEl.value = '';
      inputEl.style.height = 'auto';
      sendBtn.disabled = true;

      showTyping();

      setTimeout(() => {
        removeTyping();
        addMessage(getResponse(text));
        sendBtn.disabled = false;
        inputEl.focus();
      }, 700 + Math.random() * 800);
    }

    function sendSuggestion(text) {
      inputEl.value = text;
      sendMessage();
    }

    function handleKey(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    }

    function newChat() {
      messagesEl.innerHTML = '';
      showWelcome();
      inputEl.focus();
    }

    inputEl.addEventListener('input', function() {
      this.style.height = 'auto';
      this.style.height = Math.min(this.scrollHeight, 140) + 'px';
    });

    showWelcome();
    inputEl.focus();
  </script>
</body>
</html>
